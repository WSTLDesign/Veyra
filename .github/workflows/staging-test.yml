name: Staging-Test
on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Staging-Build erzeugen
        run: node tools/make-staging.mjs web build/staging --note "CI ${GITHUB_SHA::7}"
      - name: Smoke-Test (Handy quer, Tablet, PC)
        run: CHROME=$(which google-chrome) node tools/smoke-staging.mjs build/staging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-screenshots
          path: test-out/
