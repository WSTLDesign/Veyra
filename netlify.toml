# Veyra – Netlify
# Live-Site: Branch main → Ordner web/ unverändert.
# Staging-Site: Branch staging → Staging-Variante (eigene Speicher-Schlüssel, Badge, Debug-Menü).
[build]
  publish = "web"
  command = "echo 'Live: web/ wird unverändert veröffentlicht'"

[context.staging]
  publish = "build/staging"
  command = "node tools/make-staging.mjs web build/staging --note \"$(git log -1 --pretty=%s | cut -c1-60)\""

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
