# Veyra – Netlify
# Branch main    → Live-Site:    Build aus src/, Code verschleiert (tools/protect.mjs)
# Branch staging → Staging-Site: wie Live + getrennter Spielstand, Badge, Debug-Menü (tools/make-staging.mjs), ebenfalls verschleiert
[build]
  publish = "dist"
  command = "npm run build:live"

[build.environment]
  NODE_VERSION = "22"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[context.staging]
  publish = "build/staging"
  command = "npm run build:staging"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
